# =============================================================================
# DataLedger · 业务口径字典（语义层 v1）
# =============================================================================
#
# 【这份文件解决什么】
#
# 数仓的字段名回答不了「业务上这个词指什么」。orders.order_status 有四个取值，
# 但没有任何一列告诉你：算销售额的时候，取消单算不算、退款单算不算。
#
# 这个判断不在 schema 里，也不在字段注释里 —— 它只存在于业务方的脑子里，
# 于是每个写 SQL 的人各猜一次，猜出四个不同的数，而且**没有一个会报错**。
#
# 这份文件把那些判断**写下来**，让每次生成 SQL 之前，模型拿到的是同一套口径。
#
# 【和 db/schema.sql 里那些注释的区别（本项目最容易做错的地方）】
#
#   schema.sql 的注释是给**人和调试**看的出题笔记，带 [陷阱N] 标记，
#   标记后面跟的就是答案解析。所以 schema_card.py 的 comments 档会把这类注释
#   **整条丢掉** —— 喂给模型就等于把答案抄在它眼前。
#
#   这份字典是写给**模型**看的业务定义，用的是业务语言，不含「这里是坑」这类提示。
#   两者绝不能混。**语义层不是"把字段注释写更细"。**
#
# 【写作纪律（三条，破了这次实验就没意义）】
#
#   1. **独立于评测集写成。** 口径只来自业务含义（数仓口径常识 + 本数据集的业务设定），
#      **不参照 eval/cases.yaml 里 gold_sql 的写法**。一旦照着标准答案反推，
#      测出来的是「我有没有泄题」，不是「把口径写下来有没有用」。
#   2. **只写口径，不写 SQL 片段。** 给出字段、取值语义与判断规则，
#      但不给可以直接粘贴的 WHERE 子句 —— 那就越过了口径，变成了答案。
#   3. **一次只加一条。** 本版只有 1 条。加得越多提升越大，但**归因越难**：
#      6 条一起加、准确率涨 20 个点，你分不清是哪一条起的作用。
#      所以先加杠杆最大的一条、量出它的效果，再加下一条。
#
# 【v1 为什么只放这一条】
#
#   因为它杠杆最大：这个陷阱在 21 条用例里覆盖 17 条，通过率只有两成上下。
#   先用它回答「把口径写下来到底有没有用」；答完之后再按杠杆顺序补后面的条目。
#
# 【注意下面的 backlog 不会被注入给模型】
#
#   只有 metrics 列表会渲染成提示词的一部分。backlog 是给**我**看的路线图，
#   里面写了一些带答案的线索（比如大区到底存成什么字符串）。
#   渲染器只读 metrics，并且有一条单测专门断言 backlog 的内容不会漏进提示词。

version: 1
updated: "2026-10-09"

metrics:
  - id: order.valid_order
    name: 有效订单
    aliases:
      - 有效订单
      - 有效单
      - 成交订单
      - 订单数（用户没特别说明口径时）
    applies_to:
      - 订单数 / 订单量
      - 销售额 / 实付金额
      - 销量
      - 客单价、退货率这类比率指标的分子与分母
    definition: >
      已取消的订单，不计入任何订单量与金额类指标。
      「取消」指 orders.order_status 取值为 cancelled：下单后被撤销，
      或超时未支付而关闭。这类订单没有发生真实交易，
      计入会让订单量与金额系统性偏高。
    status_semantics:
      field: orders.order_status
      excluded:
        cancelled: 取消单 —— 没有真实交易发生，不计入任何量与金额指标。
      included:
        completed: 已完成 —— 正常结束的交易，计入。
        refunded: 已退款 —— 退款是**售后**行为，钱在下单那一刻已经收过，
          所以仍计入销售额（退款的损失由「退货率 / 退款金额」这类指标单独体现，
          不从销售额里扣）。
        pending: 待处理 —— 订单既没完成也没取消，仍在交易流程中，计入。
          （如果有一天业务要的是「只算已完结订单」，那是另一个口径，
          需要单独定义，不属于本条。）
    decision_rule: >
      判断这笔交易有没有被取消，而不是判断它有没有结束。
      所以 refunded 和 pending 都要计入 —— 这是本条口径里最容易再做错一次的地方。

# -----------------------------------------------------------------------------
# 待补条目（按杠杆顺序；一条验证过再加下一条，不要一次全加）
# -----------------------------------------------------------------------------
backlog:
  - id: metric.sales_amount
    name: 销售额用哪个金额字段
    why: 三个金额字段互不相等，选错不报错
  - id: dim.region_group
    name: 大区名称的匹配方式
    why: 库里存的值和用户说的词不是同一个字符串
  - id: dim.category
    name: 一级 / 二级类目的选择
    why: 选错列不报错，只是答案错
  - id: metric.sales_volume
    name: 「销量」的三种口径
    why: 订单数 / 件数 / 金额，三种都能自圆其说
  - id: metric.refund_rate
    name: 退货率的分母与退款状态
    why: 分母三种 × 状态三种，且订单月 ≠ 退款月
  - id: join.refunds_nullable
    name: 可空外键的连接方式
    why: 内连接会静默丢掉整整一类记录
